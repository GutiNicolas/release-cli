[project]
name = "release-cli"
version = "0.3.0"
description = "Cut release candidates and final versions for Maven, Gradle, sbt and Go projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = []

[project.scripts]
release = "release_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# Bugs only (pyflakes, bugbear, syntax) plus import order; style is not gated.
select = ["F", "B", "E9", "I"]
